<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلاعات پرداخت | دادبان مهر ایرانیان</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:radial-gradient(circle at 15% 15%,#233b60 0,#101d35 38%,#071326 100%);
    font-family:Tahoma,Arial,sans-serif; color:#f7f4ee;
  }
  .card{
    width:min(100%,620px); overflow:hidden; position:relative;
    border:1px solid rgba(220,180,105,.55); border-radius:26px;
    background:linear-gradient(145deg,rgba(25,48,82,.98),rgba(7,19,39,.99));
    box-shadow:0 24px 70px rgba(0,0,0,.4); padding:30px;
  }
  .card:before,.card:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(220,180,105,.12);border-radius:50%;pointer-events:none}
  .card:before{top:-110px;left:-70px}.card:after{bottom:-130px;right:-70px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
  .brand h1{font-size:clamp(20px,4vw,28px);margin:0 0 8px;color:#f4d39a}
  .brand p{margin:0;color:#c8d0dc;font-size:13px}
  .mark{width:62px;height:62px;flex:0 0 62px;border:1px solid #dcb469;border-radius:50%;display:grid;place-items:center;color:#e8c27f;font-size:31px}
  .field{position:relative;padding:17px 18px;margin:14px 0;border:1px solid rgba(220,180,105,.28);border-radius:16px;background:rgba(255,255,255,.045)}
  .label{font-size:13px;color:#e7c27e;margin-bottom:10px}
  .value{font-size:clamp(16px,3.6vw,22px);font-weight:700;letter-spacing:1px;direction:ltr;text-align:right;overflow-wrap:anywhere}
  .subvalue{font-size:16px;letter-spacing:.4px}
  .copy{margin-top:13px;border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,#f0d49d,#c99a4c);color:#14233b;font-weight:700;font-size:14px;cursor:pointer}
  .copy:hover{filter:brightness(1.06)} .copy:focus-visible{outline:3px solid white;outline-offset:3px}
  .holder{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 4px 8px}
  .holder .label{margin:0 0 8px}.holder strong{font-size:17px}
  .bank{color:#d9c49e;font-size:13px;white-space:nowrap}
  .note{margin:22px 0 0;padding-top:17px;border-top:1px solid rgba(220,180,105,.25);font-size:13px;line-height:2;color:#d5dce6}
  .footer{text-align:center;margin-top:22px;color:#c99f5b;font-size:11px;letter-spacing:3px;direction:ltr}
  @media(max-width:420px){.card{padding:22px}.mark{width:52px;height:52px;flex-basis:52px}.holder{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="brand">
      <h1>دادبان مهر ایرانیان</h1>
      <p>دفتر حقوقی و رسانه‌ای</p>
    </div>
    <div class="mark" aria-hidden="true">⚖</div>
  </header>

  <section class="field">
    <div class="label">شماره کارت</div>
    <div class="value" id="cardNumber">0000 0000 0000 0000</div>
    <button class="copy" type="button" data-copy="cardNumber">کپی شماره کارت</button>
  </section>

  <section class="field">
    <div class="label">شماره شبا</div>
    <div class="value subvalue" id="iban">IR00 0000 0000 0000 0000 0000 00</div>
    <button class="copy" type="button" data-copy="iban">کپی شماره شبا</button>
  </section>

  <section class="holder">
    <div>
      <div class="label">به نام صاحب حساب</div>
      <strong id="accountName">نام و نام خانوادگی صاحب حساب</strong>
    </div>
    <div class="bank" id="bankName">نام بانک</div>
  </section>

  <p class="note">لطفاً پس از واریز، تصویر رسید پرداخت را برای دفتر ارسال نمایید.</p>
  <div class="footer">DADBAN MEHR IRANIAN</div>
</main>
<script>
  // فقط مقادیر داخل کوتیشن را با اطلاعات صحیح جایگزین کنید.
  const paymentInfo = {
    cardNumber: "5859 8311 8318 2160",
    iban: "IR10 0180 0000 0013 6466 9052 72",
    accountName: "اسماعیل افشاریان فر",
    bankName: "بانک تجارت"
  };

  document.getElementById("cardNumber").textContent = paymentInfo.cardNumber;
  document.getElementById("iban").textContent = paymentInfo.iban;
  document.getElementById("accountName").textContent = paymentInfo.accountName;
  document.getElementById("bankName").textContent = paymentInfo.bankName;

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    if (!ok) throw new Error("copy failed");
  }

  document.querySelectorAll("[data-copy]").forEach(button => {
    button.addEventListener("click", async () => {
      const key = button.dataset.copy;
      const original = button.textContent;
      try {
        await copyText(paymentInfo[key].replace(/\s+/g, ""));
        button.textContent = "کپی شد ✓";
      } catch {
        button.textContent = "کپی انجام نشد";
      }
      setTimeout(() => button.textContent = original, 1800);
    });
  });
</script>
</body>
</html>
